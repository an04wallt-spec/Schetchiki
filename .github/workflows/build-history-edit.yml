name: Build history edit APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify exact baseline
        run: python scripts/verify_baseline.py
      - name: Download apktool 3.0.3
        run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum -c -
      - name: Decompile baseline
        run: java -jar apktool.jar d -f baseline/Schetchiki-v0.5-FINAL.apk -o work
      - name: Apply only history editing patch
        run: python scripts/patch_history_edit.py work
      - name: Rebuild patched code
        run: java -jar apktool.jar b work -o rebuilt.apk
      - name: Create APK from original baseline with only classes.dex replaced
        run: |
          python - <<'PY'
          import zipfile, pathlib
          base = pathlib.Path('baseline/Schetchiki-v0.5-FINAL.apk')
          rebuilt = pathlib.Path('rebuilt.apk')
          out = pathlib.Path('Schetchiki-v0.5-HISTORY-EDIT-unsigned.apk')
          with zipfile.ZipFile(rebuilt, 'r') as z:
              dex = z.read('classes.dex')
          with zipfile.ZipFile(base, 'r') as zin, zipfile.ZipFile(out, 'w') as zout:
              for info in zin.infolist():
                  name = info.filename
                  if name == 'classes.dex' or name.startswith('META-INF/'):
                      continue
                  data = zin.read(name)
                  ni = zipfile.ZipInfo(name, info.date_time)
                  ni.compress_type = info.compress_type
                  ni.comment = info.comment
                  ni.extra = info.extra
                  ni.internal_attr = info.internal_attr
                  ni.external_attr = info.external_attr
                  ni.create_system = info.create_system
                  ni.flag_bits = info.flag_bits
                  zout.writestr(ni, data)
              ni = zipfile.ZipInfo('classes.dex')
              ni.compress_type = zipfile.ZIP_DEFLATED
              zout.writestr(ni, dex)
          PY
      - name: Verify all non-code payloads are byte-identical to baseline
        run: |
          python - <<'PY'
          import zipfile, hashlib, sys
          a='baseline/Schetchiki-v0.5-FINAL.apk'
          b='Schetchiki-v0.5-HISTORY-EDIT-unsigned.apk'
          with zipfile.ZipFile(a) as za, zipfile.ZipFile(b) as zb:
              an=[n for n in za.namelist() if n!='classes.dex' and not n.startswith('META-INF/')]
              bn=[n for n in zb.namelist() if n!='classes.dex' and not n.startswith('META-INF/')]
              assert an==bn, (an,bn)
              for n in an:
                  assert za.read(n)==zb.read(n), n
          print('NON_CODE_PAYLOAD_IDENTICAL')
          PY
          unzip -t Schetchiki-v0.5-HISTORY-EDIT-unsigned.apk
          sha256sum Schetchiki-v0.5-HISTORY-EDIT-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Schetchiki-v0.5-HISTORY-EDIT-unsigned
          path: Schetchiki-v0.5-HISTORY-EDIT-unsigned.apk
