name: Build Schetchiki v0.9 migration APK

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/verify_baseline.py
      - run: |
          curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum -c -
      - run: java -jar apktool.jar d -f baseline/Schetchiki-v0.5-FINAL.apk -o work
      - run: python scripts/patch_history_edit.py work
      - run: python scripts/set_version.py work 9 0.9
      - run: java -jar apktool.jar b work -o rebuilt.apk
      - name: Preserve baseline except code and version manifest
        run: |
          python - <<'PY'
          import zipfile, pathlib
          base=pathlib.Path('baseline/Schetchiki-v0.5-FINAL.apk')
          rebuilt=pathlib.Path('rebuilt.apk')
          out=pathlib.Path('Schetchiki-v0.9-HISTORY-EDIT-unsigned.apk')
          with zipfile.ZipFile(rebuilt) as z:
              repl={n:z.read(n) for n in ('classes.dex','AndroidManifest.xml')}
          with zipfile.ZipFile(base) as zin, zipfile.ZipFile(out,'w') as zout:
              for info in zin.infolist():
                  n=info.filename
                  if n in repl or n.startswith('META-INF/'):
                      continue
                  data=zin.read(n)
                  ni=zipfile.ZipInfo(n, info.date_time)
                  ni.compress_type=info.compress_type
                  ni.comment=info.comment
                  ni.extra=info.extra
                  ni.internal_attr=info.internal_attr
                  ni.external_attr=info.external_attr
                  ni.create_system=info.create_system
                  ni.flag_bits=info.flag_bits
                  zout.writestr(ni,data)
              for n,data in repl.items():
                  ni=zipfile.ZipInfo(n)
                  ni.compress_type=zipfile.ZIP_DEFLATED
                  zout.writestr(ni,data)
          PY
          unzip -t Schetchiki-v0.9-HISTORY-EDIT-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Schetchiki-v0.9-HISTORY-EDIT-unsigned
          path: Schetchiki-v0.9-HISTORY-EDIT-unsigned.apk
