plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.schetchiki.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.schetchiki.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5-source-baseline'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
